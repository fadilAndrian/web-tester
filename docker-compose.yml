version: '3.8'

services:
  # PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    container_name: qa-flow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
      POSTGRES_DB: qa_flow_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_flow_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # QA Flow Studio Web Server & Automation Runner
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-flow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      FORCE_HEADLESS: "true"
      DATABASE_URL: postgresql://qa_user:qa_password@db:5432/qa_flow_studio
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/.data

volumes:
  pgdata:
